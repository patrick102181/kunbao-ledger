name: 回測點位規則

# 回測 App 裡「觀察股點位」和「ETF 補倉點」的規則，結果寫到 data/backtest.json
on:
  workflow_dispatch:
    inputs:
      market:
        description: "要回測哪一塊"
        required: true
        default: "all"
        type: choice
        options: [all, tw, us, core]
      period:
        description: "回測期間（12y＝近 12 年；max＝能抓多久抓多久，含 2000、2008 兩次大熊市）"
        required: true
        default: "12y"
        type: choice
        options: ["12y", "max"]

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 回測
        run: python backtest.py --market "${{ inputs.market }}" --period "${{ inputs.period }}"
      - name: 結果先存成 artifact（推不上去也不會不見）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.period }}
          path: data/backtest.json
          if-no-files-found: ignore
      - name: 存回 repo
        run: |
          git config user.name "kunbao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "回測結果 ${{ inputs.period }} $(date -u +%F)"
          git reset --hard HEAD   # 丟掉下載時改到的快取檔，只留回測結果這個 commit
          git clean -fd
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
